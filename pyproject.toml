[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tingji"
version = "0.1.0"
description = "听记：Mac 上的全天录音助理，把谈话整理成事件、待办和项目，自带 MCP 给 Agent 读"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "requests",
    "sherpa-onnx>=1.10",
    "mcp>=1.2",
]

[project.scripts]
tingji = "tingji.cli:main"
tingji-mcp = "tingji.mcp_server:main"

[tool.setuptools]
packages = ["tingji"]
